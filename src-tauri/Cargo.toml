[package]
name = "reminder-app"
version = "0.1.0"
description = "یادآوری کارهای روزانه — Persian daily task reminder (Tauri v2 + Rust)"
authors = ["Muse"]
edition = "2021"

[lib]
name = "reminder_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
