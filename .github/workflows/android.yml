name: Android APK (debug)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # The generated Gradle task (BuildTask.kt) runs `node tauri ...`, but
      # Node can never resolve a bare `tauri` module (known upstream bug,
      # tauri-apps/tauri#13892). The documented workaround is the cargo CLI,
      # so install it here; the Gradle task is patched to use it below.
      - name: Install Tauri CLI (cargo)
        run: cargo install tauri-cli --version "^2"

      # The GitHub runner already ships the Android SDK. The third-party
      # setup-android action failed, so install the missing pieces directly
      # with sdkmanager instead of downloading another SDK.
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # icons/ holds binary files, so it was never pushed to the repo, but
      # Tauri needs icons/icon.png at compile time and at android init.
      # Restore the real icon from the copy embedded below if it is missing.
      - name: Restore app icon (if missing)
        working-directory: src-tauri
        run: |
          if [ ! -f icons/icon.png ]; then
            mkdir -p icons
            echo '' | base64 -d > icons/icon.png
            ls -la icons/icon.png
          fi

      - name: Init Android project (if needed)
        working-directory: src-tauri
        run: |
          if [ ! -d gen/android ]; then
            tauri android init
          fi
          # BuildTask.kt runs `node tauri android android-studio-script`,
          # which fails with "Cannot find module '.../src-tauri/tauri'".
          # Point it at the cargo CLI instead (same arguments).
          sed -i 's/"""node"""/"""cargo"""/' gen/android/buildSrc/src/main/java/com/muse/reminder/kotlin/BuildTask.kt
          grep -n 'executable =' gen/android/buildSrc/src/main/java/com/muse/reminder/kotlin/BuildTask.kt

      - name: Build debug APK
        working-directory: src-tauri
        env:
          CARGO_BUILD_JOBS: 2
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false"
        run: tauri android build --debug --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reminder-app-debug-apk
          # The build uses the arm64 ABI flavor, so the APK lands in
          # outputs/apk/arm64Debug/ (not outputs/apk/debug/).
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
