name: Android APK (debug)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # The GitHub runner already ships the Android SDK. The third-party
      # setup-android action failed, so install the missing pieces directly
      # with sdkmanager instead of downloading another SDK.
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Init Android project (if needed)
        working-directory: src-tauri
        run: |
          if [ ! -d gen/android ]; then
            cargo tauri android init
          fi

      - name: Build debug APK
        working-directory: src-tauri
        env:
          CARGO_BUILD_JOBS: 2
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false"
        run: cargo tauri android build --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reminder-app-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
